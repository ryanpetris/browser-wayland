name: viewer
on: [push, pull_request]
jobs:
  visualiser:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Browser rig dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed nodejs npm chromium make rust pkgconf gstreamer gst-plugins-base mesa libxkbcommon
      - name: Viewer build and checks
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
          npm run check:visualiser
          cargo test --manifest-path ../Cargo.toml -p elsewhere-server --release --locked web_asset_tests
