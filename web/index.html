<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browser-wayland</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #s { position: fixed; left: 8px; bottom: 8px; color: #9a9; font: 12px monospace; pointer-events: none; }
  #btns { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 6px; }
  #btns button { background: #333; color: #ccc; border: 0; border-radius: 4px; font: 14px sans-serif; padding: 2px 8px; opacity: .6; }
  #panel { position: fixed; top: 0; right: 0; bottom: 32px; width: 320px; background: rgba(20,20,24,.92); color: #ddd; font: 13px sans-serif; overflow: auto; display: none; }
  #panel.open { display: block; }
  #spawn { width: calc(100% - 16px); box-sizing: border-box; margin: 8px; padding: 4px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; }
  .win { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #2a2a2e; }
  .win:hover { background: rgba(255,255,255,.06); }
  .win.focused { background: rgba(255,255,255,.12); }
  .win .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .win .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .win .badge { font-size: 11px; color: #9a9; }
  .win button { background: none; border: 0; color: #aaa; cursor: pointer; padding: 0 2px; font-size: 14px; }
  .win button:hover { color: #fff; }
  :fullscreen #btns, :fullscreen #panel { display: none; }
</style>
<canvas id="c"></canvas>
<aside id="panel"><input id="spawn" placeholder="run a command… (Enter)"><div id="wins"></div></aside>
<div id="s">connecting…</div>
<div id="btns">
  <button id="panelbtn" title="Windows">☰</button>
  <button id="fs" title="Fullscreen (browser shortcuts go to the desktop)">⛶</button>
</div>
<script type="module" src="/app.js"></script>
