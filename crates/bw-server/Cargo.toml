[package]
name = "bw-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bw-core = { path = "../bw-core" }
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = "0.23"
rcgen = "0.14"
sha2 = "0.10"
if-addrs = "0.15"
calloop = "0.14"
serde_json = { version = "1", features = ["raw_value"] }
png = "0.17"
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
rmcp = { version = "3", features = ["transport-streamable-http-server"] }
schemars = "1"
base64 = "0.22"
str0m = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
