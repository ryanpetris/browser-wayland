[package]
name = "elsewhere-stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
elsewhere-core = { path = "../elsewhere-core" }
anyhow.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing.workspace = true
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gstreamer-allocators = { version = "0.25", features = ["v1_24"] }
